<div class="mx-auto max-w-md">
  <div class="rounded-xl border border-slate-800 bg-slate-950 p-6 shadow">
    <h1 class="mb-2 text-xl font-semibold">Sign in</h1>
    <p class="mb-4 text-sm text-slate-400">Use seeded account: <span class="font-mono">owner@turbovets.com / password</span></p>

    <form class="space-y-3" (ngSubmit)="submit()">
      <div>
        <label class="block text-sm mb-1">Email</label>
        <input class="w-full rounded-lg border border-slate-700 bg-slate-900 p-2" type="email" [formControl]="form.controls.email" />
      </div>
      <div>
        <label class="block text-sm mb-1">Password</label>
        <input class="w-full rounded-lg border border-slate-700 bg-slate-900 p-2" type="password" [formControl]="form.controls.password" />
      </div>

      <button class="rounded-lg bg-blue-600 px-4 py-2 hover:bg-blue-500 disabled:opacity-50" [disabled]="loading" type="submit">
        {{ loading ? 'Signing in…' : 'Sign in' }}
      </button>

      <div *ngIf="error" class="mt-2 text-sm text-red-400">{{ error }}</div>
    </form>
  </div>
</div>
